<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carrito de Compras</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<header>
    <h1>Carrito de Compras</h1>
    <button id="btnCarrito">🛒 Ver Carrito (<span id="contador">0</span>)</button>
</header>

<main id="productos-container" class="productos-container"></main>


<aside id="carrito" class="carrito">
    <h2>Tu Carrito</h2>
    <ul id="listaCarrito"></ul>
    <p id="total">Total: Q0.00</p>
    <button id="vaciarCarrito" class="btn-vaciar">Vaciar Carrito</button>
    <button id="cerrarCarrito" class="btn-cerrar">Cerrar</button>
</aside>

<script src="script.js"></script>
</body>
</html>
