<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tienda Online</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<header class="header">
    <div class="container">
        <div class="header-content">
            <h1>🛒 Mi Tienda Online</h1>
            <nav>
                <a th:href="@{/home}" class="nav-link active">Inicio</a>
                <a th:href="@{/cart}" class="nav-link">
                    Carrito
                    <span class="badge" th:text="${cartItemCount}">0</span>
                </a>
            </nav>
        </div>
    </div>
</header>

<main class="main-content">
    <div class="container">

        <div th:if="${successMessage}" class="alert alert-success">
            <span th:text="${successMessage}"></span>
        </div>

        <div th:if="${errorMessage}" class="alert alert-error">
            <span th:text="${errorMessage}"></span>
        </div>

        <div class="page-header">
            <h2>Productos Disponibles</h2>
        </div>

        <div class="products-grid" th:if="${not #lists.isEmpty(products)}">
            <div class="product-card" th:each="producto : ${products}">
                <div class="product-info">
                    <h3 th:text="${producto.nombre}">Producto</h3>
                    <p th:text="${producto.descripcion}">Descripcion</p>
                    <p>Precio: $<span th:text="${producto.precio}">0.00</span></p>
                    <p>Stock: <span th:text="${producto.stock}">0</span></p>

                    <form th:action="@{/cart/add}" method="post">
                        <input type="hidden" name="productId" th:value="${producto.id}">
                        <input type="number" name="quantity" value="1" min="1" th:max="${producto.stock}">
                        <button type="submit" th:disabled="${producto.stock == 0}">
                            <span th:if="${producto.stock > 0}">Agregar</span>
                            <span th:unless="${producto.stock > 0}">Sin Stock</span>
                        </button>
                    </form>
                </div>
            </div>
        </div>

        <div th:if="${#lists.isEmpty(products)}">
            <p>No hay productos disponibles.</p>
        </div>
    </div>
</main>

<footer>
    <p>&copy; 2025 Mi Tienda Online</p>
</footer>
</body>
</html>
